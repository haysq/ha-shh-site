<section class="page-head">
  <div class="wrap narrow">
    <span class="eyebrow">{{common.nav_faq}}</span>
    <h1>{{page.h1}}</h1>
    <p class="lead">{{page.lead}}</p>
  </div>
</section>
<section style="padding-top:8px">
  <div class="wrap narrow">
    {{#each page.items}}<details class="faq"><summary>{{.q}}</summary><p>{{.a}}</p></details>
    {{/each}}
    <div class="card dev" style="margin-top:28px">
      <span class="av" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
      <div><b>{{page.contact_h}}</b><p style="margin:.2em 0 .4em">{{page.contact_p}}</p><a href="mailto:{{email}}">{{email}}</a></div>
    </div>
  </div>
</section>
